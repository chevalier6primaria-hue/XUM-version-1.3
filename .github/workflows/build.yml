name: Build XUM (VST3)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Entorno MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: cmake --build build --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: XUM-VST3-win64
          path: build/XUM_artefacts/**/VST3/*.vst3
          if-no-files-found: error
